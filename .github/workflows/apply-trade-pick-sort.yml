name: Apply trade analyzer pick sort

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-main:
    if: github.event.pull_request.head.ref == 'bot/trade-pick-sort-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sort hypothetical picks by tier then exact slot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/trades/analyzer/page.tsx")
          text = path.read_text()

          old_show = '''    // Prefer numbered slot picks (1.01, 1.02, …); use tier picks only when no slots exist for that year/round.
    const numberedYearRounds = new Set(
      numbered.map((p) => `${p.name.match(/^(\\d{4})/)?.[1] ?? 'Other'}_${pickRound(p.sleeperId)}`),
    );
    const picksToShow = [
      ...numbered,
      ...tier.filter((p) => {
        const year = p.name.match(/^(\\d{4})/)?.[1] ?? 'Other';
        return !numberedYearRounds.has(`${year}_${pickRound(p.sleeperId)}`);
      }),
    ];
'''
          new_show = '''    // Keep both hypothetical levels available. Within each round, show broad
    // Early/Mid/Late estimates first, followed by exact slot scenarios 1.01–1.12.
    const picksToShow = [...tier, ...numbered];
'''
          if old_show not in text:
              raise SystemExit("Missing expected pick visibility block")
          text = text.replace(old_show, new_show, 1)

          old_sort = '''        const picks = byRound.get(round)!.sort((a, b) => {
          const slotA = pickSlot(a.sleeperId);
          const slotB = pickSlot(b.sleeperId);
          if (slotA !== null && slotB !== null) return slotA - slotB;
          if (slotA !== null) return -1;
          if (slotB !== null) return 1;
          return pickTierRank(a.sleeperId) - pickTierRank(b.sleeperId) || b.value - a.value;
        });
'''
          new_sort = '''        const picks = byRound.get(round)!.sort((a, b) => {
          const tierA = isTierPickId(a.sleeperId);
          const tierB = isTierPickId(b.sleeperId);
          if (tierA && tierB) return pickTierRank(a.sleeperId) - pickTierRank(b.sleeperId) || b.value - a.value;
          if (tierA) return -1;
          if (tierB) return 1;

          const slotA = pickSlot(a.sleeperId);
          const slotB = pickSlot(b.sleeperId);
          if (slotA !== null && slotB !== null) return slotA - slotB;
          if (slotA !== null) return -1;
          if (slotB !== null) return 1;
          return b.value - a.value;
        });
'''
          if old_sort not in text:
              raise SystemExit("Missing expected pick sort block")
          text = text.replace(old_sort, new_sort, 1)

          old_label = '''              {rg.picks.map((v) => {
                const slot = pickSlot(v.sleeperId);
                const label = slot !== null
                  ? `${rg.round}.${String(slot).padStart(2, '0')}`
                  : v.name.replace(/^\\d{4}\\s*/, '');
'''
          new_label = '''              {rg.picks.map((v) => {
                const slot = pickSlot(v.sleeperId);
                const tierMatch = v.sleeperId.match(/_(EARLY|MID|LATE)$/);
                const tierName = tierMatch
                  ? `${tierMatch[1][0]}${tierMatch[1].slice(1).toLowerCase()}`
                  : null;
                const roundOrdinal = rg.label.replace(/\\s+Round$/, '');
                const label = slot !== null
                  ? `${g.year} ${rg.round}.${String(slot).padStart(2, '0')}`
                  : tierName
                    ? `${g.year} ${tierName} ${roundOrdinal}`
                    : v.name;
'''
          if old_label not in text:
              raise SystemExit("Missing expected pick label block")
          text = text.replace(old_label, new_label, 1)

          path.write_text(text)
          PY

      - name: Commit change to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/trades/analyzer/page.tsx"
          git diff --cached --check
          git commit -m "Sort trade analyzer picks by tier then slot"
          git push origin HEAD:main
