<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">East v. West</title>
  <desc id="desc">Red and blue East v. West fantasy football app icon</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c32"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c92c43"/>
      <stop offset="0.5" stop-color="#8f1f37"/>
      <stop offset="0.5" stop-color="#2159b5"/>
      <stop offset="1" stop-color="#173f86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
